name: Release

# Build prebuilt binaries and publish them as GitHub Release artifacts.
#
# Triggers when a version tag (e.g. v1.3.0) is pushed. You can also run it
# manually from the Actions tab (workflow_dispatch) to test the build without
# creating a release.
#
# Phase 1 (see issue #6): binaries only. Package managers (homebrew, apt,
# snap, flatpak, ...) are intentionally left as a day-2 improvement.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create releases and upload assets

jobs:
  # ---------------------------------------------------------------------------
  # Linux (amd64) - native build on an x86_64 runner.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build
        run: make build-linux

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/nelko-print-${GITHUB_REF_NAME}-linux-amd64.tar.gz \
            nelko-print README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*

  # ---------------------------------------------------------------------------
  # Windows (amd64) - cross-compiled from Linux with mingw-w64.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev mingw-w64

      - name: Build
        run: make build-windows

      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/nelko-print-${GITHUB_REF_NAME}-windows-amd64.zip \
            nelko-print.exe README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/*

  # ---------------------------------------------------------------------------
  # macOS (arm64/amd64) - PLACEHOLDER.
  #
  # Makefile target and the darwin Bluetooth backend. macOS needs a native
  # runner because Fyne requires CGO and cannot be cross-compiled from Linux.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
  
      - name: Build
        run: make build-macos
  
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/nelko-print-${GITHUB_REF_NAME}-macos-arm64.tar.gz \
            nelko-print README.md LICENSE
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

  # ---------------------------------------------------------------------------
  # Collect all build artifacts and publish the GitHub Release.
  # Only runs for tag pushes, not manual dispatch.
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs:
      - build-linux
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
